design_decisions:
  - decision: Reuse .sk-v1 shimmer class, do not create a new animation
    rationale: globals.css already has the shimmer keyframe + prefers-reduced-motion suppression. Reuse keeps accessibility coverage consistent.
  - decision: LibrarySkeleton grid must match DesignLibrary class exactly
    rationale: Visual consistency — the skeleton should look like the loaded state minus content.

risks:
  - severity: medium
    description: Generation pending wiring point may differ from expected path if the wizard uses a client-side polling loop rather than a server component status prop.
    mitigation: Developer reads app/(authenticated)/design/new/page.tsx and the studio wizard components before wiring; adapt wiring to actual pending-state mechanism.

