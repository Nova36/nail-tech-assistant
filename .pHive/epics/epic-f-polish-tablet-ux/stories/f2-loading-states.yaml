files_to_modify:
  - file: components/LoadingStates/GenerationPending.tsx
    change: net-new skeleton for generation in-progress state.
  - file: components/LoadingStates/LibrarySkeleton.tsx
    change: net-new skeleton grid for library loading state.
  - file: components/LoadingStates/index.ts
