design_decisions:
  - decision: Use lg breakpoint (1024px) for sidebar visibility, not md (768px)
    rationale: At md (768px) sidebar would hide on small tablets that still have enough room. lg keeps it visible at iPad landscape (1180px > 1024px) while hiding below that.
  - decision: Extract client shell wrapper, keep server-side session logic
    rationale: Session redirect must stay server-side for security. Only the toggle state needs to be client-side. Pattern mirrors Next.js recommended server+client component split.
  - decision: Off-canvas drawer over icon-only sidebar collapse
    rationale: Simpler implementation; icon-only sidebar requires redesign of nav labels. Off-canvas is sufficient for demo confidence at this deadline.

risks:
  - severity: medium
    description: Converting layout to use a client shell wrapper may introduce a hydration mismatch if sidebar state affects SSR output.
    mitigation: Default sidebarOpen to false (closed); SSR output is always the closed state; no mismatch.
  - severity: low
    description: z-index of drawer overlay may conflict with existing toast or modal z-index.
    mitigation: Use z-50 for overlay; inspect existing z-index usage in globals.css and components before committing.

