files_to_modify:
  - file: components/ErrorSurface.tsx
    change: net-new generic error surface component with exported props interface.
  - file: app/(authenticated)/error.tsx
    change: net-new Next.js error boundary for authenticated routes wiring ErrorSurface.

design_decisions:
  - decision: Scope error boundary to (authenticated) segment only
    rationale: Root app/ error boundary would catch login page errors and render the wrong UI. Authenticated segment scoping is precise.
  - decision: Keep GenerationErrorState and InlineBrowseError unchanged
    rationale: Domain-specific components carry domain-specific copy and recovery flows. ErrorSurface is a fallback only, not a replacement.

risks:
  - severity: low
    description: Next.js may already have a root error.tsx that conflicts.
    mitigation: Check app/ and app/(authenticated)/ for existing error.tsx before creating; adapt placement.

