files_to_modify:
  - file: tests/e2e/core-flow.spec.ts
    change: net-new critical-path smoke spec.
  - file: tests/e2e/tablet-smoke.spec.ts
    change: net-new iPad landscape smoke spec.
  - file: playwright.config.ts
    change: Add ipad-landscape project using devices['iPad Pro landscape'].

design_decisions:
  - decision: Critical-path only — no regenerate or chat turns in core-flow
    rationale: Those flows have dedicated specs. Unified spec should be a confidence check, not duplicate coverage. Deadline-driven decision from decision-points.md.
  - decision: Tablet smoke uses role/text assertions only, no pixel assertions
    rationale: Pixel layout tests are brittle and require snapshot maintenance. Smoke confirms the route loads and primary UI is accessible — sufficient for demo confidence.
  - decision: Generation wait is async with graceful timeout skip
    rationale: Gemini generation can take 10–30s. Hanging the suite on Gemini latency is unacceptable in CI. Mark as skip-on-timeout with a clear note.

risks:
  - severity: high
    description: The emulator oob flow requires Firebase Auth emulator running — if it is not started, all auth-dependent tests fail.
    mitigation: The playwright.config.ts webServer command already wraps `firebase emulators:exec --only auth`. Tests inherit this. Document in README (f6 story).
  - severity: medium
    description: Generation step depends on Vertex AI / Gemini — unavailable in emulator. Test may hang.
    mitigation: Wrap generation wait in a 30s timeout; on timeout, skip remaining generation-dependent steps with a console note rather than failing.

